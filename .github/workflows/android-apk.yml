name: Build Æye Android APK (Pixel 10 Pro XL)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub pre-release with the debug APK attached (needs release_tag and the DEBUG_KEYSTORE_BASE64 secret)'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'New tag for the pre-release (required when create_release is true; must not already exist)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Debug APK & Run Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Robolectric's SDK 36 android-all jar is Java 21 bytecode, and the Firebase emulators need Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # The action's default package list includes the legacy 'tools' package, which the SDK repository no longer
      # serves ("Failed to find package 'tools'"), so request only platform-tools. AGP installs the compile SDK itself.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # AGP 9.1.1 needs Gradle 9.x. This matches gradle/wrapper/gradle-wrapper.properties
      # (gradlew and the wrapper jar are not committed, so the wrapper itself cannot be used).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Node.js (Firebase emulators and rules tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase emulator and rules-test tooling
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/fbtools" \
            firebase-tools@14.27.0 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
          echo "$RUNNER_TEMP/fbtools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$RUNNER_TEMP/fbtools/node_modules" >> "$GITHUB_ENV"

      # Robolectric downloads the ~213 MB SDK 36 android-all jar at test time; setup-gradle does not cache it.
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      # Signing material is never committed. The debug key comes from the DEBUG_KEYSTORE_BASE64 secret; without it
      # (e.g. pull requests from forks) a throwaway key lets the build and tests run, but that APK is never published.
      - name: Prepare environment and signing keystore
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set: the APK is signed with a throwaway key. Google sign-in fails with it (its SHA-1 is not registered in Firebase) and it will not be published."
            echo "source=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      # firestore.test.js and the emulator-backed repository tests (EyeTrackingRepositoryRuleTest / RoundTripTest)
      # need the Auth (9099) and Firestore (8085) emulators configured in firebase.json.
      - name: Run Firestore rules suite and Unit & Robolectric Verification Suite (Firebase emulators)
        run: |
          firebase emulators:exec --only auth,firestore --project demo-no-project \
            "node --test firestore.test.js && gradle :app:testDebugUnitTest"

      - name: Assemble Installable Debug APK
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AEye-Pixel10ProXL-debug.apk
          ls -lh app/build/outputs/apk/debug/AEye-Pixel10ProXL-debug.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEye-Pixel10ProXL-APK
          path: app/build/outputs/apk/debug/AEye-Pixel10ProXL-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check release preconditions
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        env:
          KEYSTORE_SOURCE: ${{ steps.keystore.outputs.source }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$KEYSTORE_SOURCE" != "secret" ]; then
            echo "::error::Refusing to publish: the APK was signed with a throwaway key. Set the DEBUG_KEYSTORE_BASE64 secret."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              echo "::error::release_tag is required when create_release is true."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "::error::Tag $TAG already exists. Choose a new release_tag so the release matches the commit its APK was built from."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # This is a debuggable, debug-signed build, so it is published as a pre-release, never as a production release.
      - name: Publish debug APK as a GitHub pre-release
        if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Æye (${{ steps.release.outputs.tag }}) — debug build"
          body: |
            ### Æye — region-level gaze, AAC & reading telemetry (debug build)
            This is a **debuggable, debug-signed test build**, not a production release. On a debuggable build, anyone with USB/ADB access to the phone can read the app's local data.
            Built from commit ${{ github.sha }}. Target device: Google Pixel 10 Pro XL.

            #### Installation
            1. Download **`AEye-Pixel10ProXL-debug.apk`** from the **Assets** section below.
            2. Open the downloaded `.apk` on the phone and allow installation.
            3. Grant front-camera permission on first launch. The app requests a 1280×960 analysis stream and steps down when the frame rate drops; CameraX may negotiate a different size on the device.
          files: |
            app/build/outputs/apk/debug/AEye-Pixel10ProXL-debug.apk
          draft: false
          prerelease: true
